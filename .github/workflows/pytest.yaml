name: pytest

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get install -y graphviz
          python3 -m pip install -r requirements.txt pytest pytest-mock

      - name: Run pytest
        run: |
          python3 -m pytest
