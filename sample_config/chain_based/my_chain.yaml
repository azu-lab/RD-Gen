Seed: 0
Number of DAGs: 50

Graph structure:
  Generation method: "Chain-based"
  Number of chains:
    Fixed: 1
  Main sequence length:
    Random: (5, 10, 1)
  Number of sub sequences:
    Random: (1, 3, 1)          # 幅を持たせるため多めに設定
  Merge chains:
    Number of sink nodes:
      Fixed: 1
    Middle of chain: False
    Sink node: True

Properties:
  Multi-rate:
    Periodic type: "Entry"
    Source node period:
      Fixed: 1000
    Whole-DAG utilization:
      Fixed: 1.2
  End-to-end deadline:
    Deadline mode: 'Constrained'

Output formats:
  Naming of combination directory: "Abbreviation"
  DAG:
    YAML: True
    JSON: False
    XML: False
    DOT: False
  Figure:
    Draw legend: False
    PNG: False
    SVG: False
    EPS: False
    PDF: True