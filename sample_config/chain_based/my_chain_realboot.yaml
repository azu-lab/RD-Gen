Seed: 0
# Single-shot config for run_realboot_evaluation.py: one concrete, curated
# task set (8 DAGs, each individually at utilization 0.8) actually admitted
# and booted for real -- as opposed to my_chain.yaml, which now sweeps
# Whole-DAG utilization across many combos for the offline acceptance-ratio
# curve (run_schedulability_evaluation.py). With 8 dag-pool cores, this
# gives U_norm = (8 DAGs * 0.8) / 8 cores = 0.8 for that one real boot.
Number of DAGs: 8

Graph structure:
  Generation method: "Chain-based"
  Number of chains:
    Fixed: 1
  Main sequence length:
    Random: (5, 10, 1)
  Number of sub sequences:
    Random: (1, 3, 1)          # 幅を持たせるため多めに設定
  Merge chains:
    Number of sink nodes:
      Fixed: 1
    Middle of chain: False
    Sink node: True

Properties:
  Multi-rate:
    Periodic type: "Entry"
    Source node period:
      Fixed: 1000
    Whole-DAG utilization:
      Fixed: 0.8
  End-to-end deadline:
    Deadline mode: 'Constrained'

Output formats:
  Naming of combination directory: "Abbreviation"
  DAG:
    YAML: True
    JSON: False
    XML: False
    DOT: False
  Figure:
    Draw legend: False
    PNG: False
    SVG: False
    EPS: False
    PDF: True
