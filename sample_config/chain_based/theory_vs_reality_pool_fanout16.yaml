# Variant of theory_vs_reality_pool.yaml with the branching limit relaxed to
# what Awkernel's rd_gen_to_dags can register: its register_source! /
# register_sink! / register_intermediate! macros expand up to 16 input and
# 16 output links per node (LinkNumError beyond that). With one chain and
# every sub sequence merged into the single sink ("Middle of chain: False"),
# the sink's fan-in is 1 + (number of sub sequences) and a branching node's
# fan-out is at most 1 + (number of sub sequences), so "Number of sub
# sequences" up to 15 is exactly the macro limit. Everything else (seed,
# utilization range, fixed period, 'Constrained' deadlines, pool size) is
# unchanged, so the two pools differ only in how wide the DAGs may get.
#
Seed: 0
# Core-count-independent pool for the theory-vs-reality study (see
# awkernel/applications/rd_gen_to_dags/examples/theory_vs_reality.rs's own
# module doc for the full design). No real core count is baked in here: the
# per-DAG "Whole-DAG utilization" is spread over [0.01, 2.0], and
# theory_vs_reality.rs picks, for each target u_norm, only the DAGs whose
# measured C/T falls in a window centered on
#
#     u_norm * real_cores / dags_per_set
#
# with real_cores given on ITS command line (the processor set P every
# admission test is given, as in V-Fed's Algorithm 1). Replaces the earlier
# gen_theory_vs_reality_bins.py scheme, which generated one pool per u_norm
# bin with REAL_CORES=14 fixed at generation time.
#
# The upper bound 2.0 must cover u_norm_max * real_cores / dags_per_set for
# every machine this pool is used with (2.0 = u_norm 1.0 on 16 cores with 8
# DAGs per set); raise it for larger machines or fewer DAGs per set.
#
# Utilization is given as a tuple string "(start, stop, step)", which RD-Gen
# expands to a fine discrete list: a plain list like [0.01, 2.0] is a
# *discrete* random.choice (Util.random_choice), i.e. picks exactly 0.01 or
# 2.0 and nothing between (confirmed 2026-09-29 -- the old per-bin
# "Random: [lo, hi]" configs only ever produced their two endpoints).
#
# Deadline mode 'Constrained' (D ~ Uniform(L, T], T = the fixed period
# below) keeps the fixed period as T, so the generation-time C/T survives
# into admission unchanged (an 'Arbitrary'+override_period scheme was tried
# and rejected 2026-09-24: it re-derives the period and decorrelates C/T).
# A DAG whose critical path alone exceeds the period is dropped by RD-Gen
# (BuildFailedError), which thins out the high-utilization end: in a
# 600-DAG trial ~76% survived overall but only ~7 landed in [1.8, 2.0).
# theory_vs_reality.rs prints each window's DAG count to stderr -- raise
# Number of DAGs if the top bins come out too thin.
Number of DAGs: 10000

Graph structure:
  Generation method: "Chain-based"
  Number of chains:
    Fixed: 1
  Main sequence length:
    Random: (5, 10, 1)
  Number of sub sequences:
    Random: (1, 15, 1)         # fan-in/fan-out <= 16 (Awkernel macro limit)
  Merge chains:
    Number of sink nodes:
      Fixed: 1
    Middle of chain: False
    Sink node: True

Properties:
  Multi-rate:
    Periodic type: "Entry"
    Source node period:
      Fixed: 1000
    Whole-DAG utilization:
      Random: "(0.01, 2.0, 0.001)"
  End-to-end deadline:
    Deadline mode: 'Constrained'

Output formats:
  Naming of combination directory: "Abbreviation"
  DAG:
    YAML: True
    JSON: False
    XML: False
    DOT: False
  Figure:
    Draw legend: False
    PNG: False
    SVG: False
    EPS: False
    PDF: True
