Seed: 0
Number of DAGs: 50

Graph structure:
  Generation method: "G(n, p)"
  Number of nodes:
    Fixed: 20
  Probability of edge existence:
    Fixed: 0.3
  Number of source nodes:
    Fixed: 1
  Number of sink nodes:
    Fixed: 1
  Ensure weakly connected: True

Properties:
  Multi-rate:
    Periodic type: "Entry"
    Source node period:
      Fixed: 1000
    Whole-DAG utilization:
      Fixed: 1.2          # 1以上も指定可能
  End-to-end deadline:
    Deadline mode: 'Implicit'   # feasibility判定(L<=D)を有効にするなら推奨

Output formats:
  Naming of combination directory: "Abbreviation"
  DAG:
    YAML: True
    JSON: False
    XML: False
    DOT: False
  Figure:
    Draw legend: False
    PNG: True
    SVG: False
    EPS: False
    PDF: False